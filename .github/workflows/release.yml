name: Build and release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Optional completed run to publish without rebuilding'
        type: string
        default: ''
      release_tag:
        description: 'Existing tag for the completed build run'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Offline tests
    if: ${{ !inputs.build_run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # Install from the lockfile without the account-limited Actions cache.
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run test:release
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "require('node:assert/strict').equal(process.env.RELEASE_TAG, 'v' + require('./package.json').version)"

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-15
            command: npm run dist:mac -- --arm64
            ui: true
          - name: mac-x64
            os: macos-15-intel
            command: npm run dist:mac -- --x64
          - name: windows-x64
            os: windows-2022
            command: npm run dist:win
          - name: linux-x64
            os: ubuntu-24.04
            command: npm run dist:linux
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # Install from the lockfile without the account-limited Actions cache.
          package-manager-cache: false
      - run: npm ci
      - name: Electron UI checks with temporary profile
        if: matrix.ui == true
        run: npm run test:electron
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm xvfb
      - name: Build and inspect application package
        run: ${{ matrix.command }}
      - name: Verify packaged Electron and SQLite runtime
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a node scripts/verify-runtime.cjs
          else
            node scripts/verify-runtime.cjs
          fi
      - name: Preserve packaged-app verification report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/packaged-runtime-*.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/*.zip
            dist/*-portable.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  release:
    name: Publish complete release
    if: ${{ always() && !cancelled() && ((startsWith(github.ref, 'refs/tags/') && needs.test.result == 'success' && needs.build.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.build_run_id != '')) }}
    needs: [test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      BUILD_RUN_ID: ${{ inputs.build_run_id || github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source tag and version
        run: node -e "require('node:assert/strict').equal(process.env.RELEASE_TAG, 'v' + require('./package.json').version)"
      - name: Verify reused build belongs to the exact source tag
        if: inputs.build_run_id != ''
        run: |
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > /tmp/build-run.json
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID/jobs?per_page=100" > /tmp/build-jobs.json
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const run = JSON.parse(fs.readFileSync('/tmp/build-run.json', 'utf8'));
          const jobs = JSON.parse(fs.readFileSync('/tmp/build-jobs.json', 'utf8')).jobs;
          const tagCommit = execFileSync('git', ['rev-parse', `${process.env.RELEASE_TAG}^{commit}`], { encoding: 'utf8' }).trim();
          assert.equal(run.status, 'completed');
          assert.equal(run.head_sha, tagCommit, 'Build does not match the source tag');
          for (const name of ['Offline tests', 'Build mac-arm64', 'Build mac-x64', 'Build windows-x64', 'Build linux-x64']) {
            assert.equal(jobs.find(job => job.name === name)?.conclusion, 'success', `Required job failed: ${name}`);
          }
          console.log(`Verified successful builds for source commit ${tagCommit}`);
          NODE
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id || github.run_id }}
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify all six downloads and create checksums
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const version = require('./package.json').version;
          const files = [
            `StepQuest-${version}-mac-arm64.zip`,
            `StepQuest-${version}-mac-x64.zip`,
            `StepQuest-${version}-windows-x64-portable.exe`,
            `StepQuest-${version}-linux-x86_64.AppImage`,
            `StepQuest-${version}-linux-amd64.deb`,
            `StepQuest-${version}-linux-x86_64.rpm`,
          ].sort();
          assert.deepEqual(fs.readdirSync('release').sort(), files);
          const sums = files.map(file => {
            const data = fs.readFileSync(`release/${file}`);
            assert(data.length > 0, `Empty artifact: ${file}`);
            return `${createHash('sha256').update(data).digest('hex')}  ${file}`;
          });
          fs.writeFileSync('release/SHA256SUMS.txt', sums.join('\n') + '\n');
          NODE
      - name: Upload assets and publish
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "StepQuest $RELEASE_TAG" --notes-file "docs/release-notes-$RELEASE_TAG.md"
          gh release upload "$RELEASE_TAG" release/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
